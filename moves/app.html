<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F0E6">
<title>Moves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Shantell+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="appbody">
<div id="stage"><canvas id="cv" width="720" height="1280"></canvas><video id="vid" playsinline muted autoplay></video></div>
<div id="bar"></div>
<div id="intro"><div class="inner">
  <a class="back" href="./">← all apps</a>
  <h1 id="title"></h1>
  <p id="hook" class="hook"></p>
  <ol id="steps"></ol>
  <div id="settings"></div>
  <button id="startBtn" class="go">Start</button>
  <div id="startState">Allow the camera when the browser asks. Turn the sound on for voice cues.</div>
  <p class="privacy">Video never leaves your phone. Tracking runs on your device. Nothing is uploaded or stored.</p>
</div></div>
<div id="toast"></div>
<div id="saveSheet"><div class="box"><p>Your video is ready.</p><button id="saveBtn" class="go">Save or share</button><button id="closeSave">Close</button></div></div>
<script type="module">
import { run } from './engine.js';
import { ALL } from './all.js';
const id = new URLSearchParams(location.search).get('a') || 'pullup';
const app = ALL[id];
if (!app) location.href = './';
await document.fonts.load("800 20px 'Shantell Sans'").catch(() => {});
run(app);
</script>
</body>
</html>
