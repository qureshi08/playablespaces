<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B2EFF">
<title>Bodymark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Nunito:wght@600;700;800;900&family=Shantell+Sans:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="appbody">
<div id="stage"><canvas id="cv" width="720" height="1280"></canvas><video id="vid" playsinline muted autoplay></video></div>
<div id="bar"></div>
<div id="intro">
  <div class="top"><div class="inner">
    <a class="back" href="./">← bodymark</a>
    <h1 id="title"></h1>
    <p id="hook" class="hook"></p>
  </div></div>
  <div class="body">
    <canvas id="preview" width="800" height="600"></canvas>
    <ol id="steps"></ol>
    <div id="settings"></div>
    <button id="startBtn" class="go">Start</button>
    <div id="startState">Allow the camera when the browser asks. Turn the sound on for voice cues.</div>
    <p class="privacy">🔒 Video never leaves your phone. Tracking runs on your device. Nothing is uploaded or stored.</p>
  </div>
</div>
<div id="done"><div class="box">
  <span class="eyebrow">real push ups</span>
  <div id="doneN" class="num">0</div>
  <div id="doneRank" class="rank"></div>
  <ul id="doneSub" class="ranks"></ul>
  <button id="doneShare" class="go">share my rank →</button>
  <button id="doneAgain">go again</button>
  <a href="./" class="homelink">home</a>
  <div id="doneSrc" class="src"></div>
</div></div>
<div id="toast"></div>
<div id="saveSheet"><div class="box"><p>your video is ready.</p><button id="saveBtn" class="go">save video</button><button id="closeSave">don't save</button></div></div>
<script type="module">
import { run } from './engine.js';
import { ALL } from './all.js';
const id = new URLSearchParams(location.search).get('a') || 'bodyage';
const app = ALL[id];
if (!app) location.href = './';
await Promise.all(["900 20px Archivo", "800 20px Nunito", "800 20px 'Shantell Sans'"].map(f => document.fonts.load(f).catch(() => {})));
// moving preview of the test on its start screen, until the camera starts
import('./demos.js').then(({ drawDemo }) => {
  const pv = document.getElementById('preview').getContext('2d'); let last = -1;
  (function tick(now) { if (document.getElementById('intro').classList.contains('off')) return; const f = Math.floor(now / 80); if (f !== last) { last = f; drawDemo(id, pv, f * 0.08); } requestAnimationFrame(tick); })(0);
});
const E = await run(app);
// result screen buttons (coach apps)
document.getElementById('doneShare').onclick = () => { if (app.studio) app.studio(E); else if (E) E.share(); };
document.getElementById('doneAgain').onclick = () => { document.getElementById('done').classList.remove('on'); app.reset(E); };
// home from the result sheet goes through the same guard as the back button, so a recording is never dropped
document.querySelector('#done .homelink').onclick = e => { e.preventDefault(); E.leave('./'); };
</script>
</body>
</html>
